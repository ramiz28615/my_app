name: Dimensia — Build Android Debug APK
run-name: "Dimensia APK ${{ inputs.build_id }}"
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique request ID"
        type: string
        required: true
      app_b64:
        description: "Approved UTF-8 App.js/App.tsx source (base64, max ~40 KB)"
        type: string
        required: true
      language:
        description: "jsx or tsx"
        type: choice
        options: [jsx, tsx]
        required: true
      app_name:
        description: "Display name"
        type: string
        required: true
      android_package:
        description: "Android Java package identifier"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dimensia-native-apk-${{ inputs.build_id }}
  cancel-in-progress: false
jobs:
  build:
    name: Compile Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted builder code (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses and install API 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate input and create standalone Expo source
        env:
          DIMENSIA_BUILD_ID: ${{ inputs.build_id }}
          DIMENSIA_APP_B64: ${{ inputs.app_b64 }}
          DIMENSIA_LANGUAGE: ${{ inputs.language }}
          DIMENSIA_APP_NAME: ${{ inputs.app_name }}
          DIMENSIA_ANDROID_PACKAGE: ${{ inputs.android_package }}
        run: node scripts/prepare-native-apk.mjs
      - name: Install pinned Expo dependencies
        working-directory: native-apk-workdir
        run: npm install --no-audit --no-fund
      - name: Generate native Android Gradle project
        working-directory: native-apk-workdir
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Compile Android Debug APK
        working-directory: native-apk-workdir/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dimensia-apk-${{ inputs.build_id }}
          path: native-apk-workdir/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
