name: Browser E2E — Dimensia Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dim-browser-main
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright browser test runner
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install headless Chromium with dependencies
        run: npx playwright install --with-deps chromium
      - name: Test real page behavior and mobile layout
        run: node tests/browser-smoke.mjs
