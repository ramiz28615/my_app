name: Dimensia Polyglot Cloud Execute
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique public report ID (r + 9–35 lowercase alphanumeric)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: polyglot-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  execute:
    name: Execute ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        language: [web, javascript, python, rust, bash, perl, reactnative]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run language with restricted environment and timeout
        env:
          DIMENSIA_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/run-polyglot.mjs "${{ matrix.language }}"
      - name: Upload language result (without repository credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.language }}
          path: polyglot-output/${{ matrix.language }}.json
          if-no-files-found: warn
          retention-days: 1
  publish:
    name: Collect and publish sanitized results
    needs: execute
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: polyglot-uploads
      - name: Sanitize and aggregate public reports
        env:
          DIMENSIA_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/publish-polyglot.mjs
      - name: Commit public report to the repository
        env:
          DIMENSIA_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "code-lab/reports/${DIMENSIA_RUN_ID}.json"
          git commit -m "polyglot: public results ${DIMENSIA_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to publish report after retrying" >&2
          exit 1
